name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # the code's own checks and the page built, beside the playtest's three shares (each on a machine
  # of its own): the run takes as long as the longest of the four jobs, not all of them
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # plain mistakes in the code: undefined or unused names, unreachable code; warnings fail too
      - run: npm run lint
      # netstorm-web's simulation with the house rules applied, read by TypeScript (the build takes
      # the types off unread)
      - run: npm run typecheck
      # the rules, played without a browser: the mission for a couple of minutes, then each house rule
      - run: npm run check
      # the AI worker's cache is really in its bundle, and leaves the computer's moves as they were
      - run: npm run ai-check
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: dist

  playtest:
    # pinned: Playwright installs Chromium's system libraries for the Ubuntu releases it knows
    runs-on: ubuntu-24.04
    strategy:
      # every share plays to its end, so that one failure does not hide another
      fail-fast: false
      matrix:
        share: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # the same page as the build job's (a second's work from the same commit)
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # plays the built page in headless Chromium: the opening, a staged endgame, orders and
      # selection with mouse and keys, a skirmish, a battle the computer plays on both sides, the
      # tabletop; a third of the scenarios here, several at a time (scripts/playtest.mjs:
      # PLAYTEST_SHARD, PLAYTEST_JOBS)
      - run: npm run playtest
        env:
          PLAYTEST_SHARD: ${{ matrix.share }}/3

  deploy:
    needs: [build, playtest]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
