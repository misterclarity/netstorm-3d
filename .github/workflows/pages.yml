name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # pinned: Playwright installs Chromium's system libraries for the Ubuntu releases it knows
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # plays the mission headless for a couple of minutes of game time
      - run: npm run check
      # the AI worker's cache leaves the computer's moves as they were
      - run: npm run ai-check
      - run: npm run build
      # plays the built page in headless Chromium: the opening, a staged endgame, a skirmish and the tabletop
      - run: npx playwright install --with-deps chromium
      - run: npm run playtest
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
